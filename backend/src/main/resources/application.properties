spring.application.name=cafeteria
server.port=8080

# ---------- Persistencia (H2 en archivo: los datos sobreviven al reinicio) ----------
spring.datasource.url=jdbc:h2:file:./data/cafeteria;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola web de H2 para evidencias: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/cafeteria   Usuario: sa   Password: (vacio)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JWT ----------
# Clave HMAC-SHA256 en Base64 (solo para el prototipo; en produccion va en variable de entorno)
app.jwt.secret=Q2FmZXRlcmlhVVRDaEVxdWlwbzQtQ2xhdmVTZWNyZXRhSldULTIwMjYtUHJvdG90aXBv
app.jwt.expiration-ms=28800000

# ---------- CORS (Angular en desarrollo) ----------
app.cors.allowed-origin=http://localhost:4200
