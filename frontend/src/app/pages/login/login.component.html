<section class="login">
  <div class="card login-card">
    <h1>Cafetería UTCh</h1>
    <p class="muted">Inicia sesión para continuar</p>

    <form [formGroup]="form" (ngSubmit)="entrar()">
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="username" />
      </label>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="error-text">Escribe un email válido</small>
      }

      <label>
        Contraseña
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      @if (error()) {
        <div class="alert alert-error">{{ error() }}</div>
      }

      <button class="btn btn-primary btn-block" type="submit" [disabled]="enviando()">
        {{ enviando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <div class="demos">
      <span class="muted">Usuarios de prueba:</span>
      @for (d of demos; track d.email) {
        <button type="button" class="btn btn-ghost btn-sm" (click)="usarDemo(d)">{{ d.etiqueta }}</button>
      }
    </div>
  </div>
</section>
